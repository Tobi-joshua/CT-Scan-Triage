name: Validate Render Blueprint

on:
  push:
    branches: [main]
    paths:
      - "render.yaml"
      - ".github/workflows/render-blueprint-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_WORKSPACE: ${{ secrets.RENDER_WORKSPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Structural Blueprint check
        run: |
          python - <<'PY'
          import pathlib, re
          text=pathlib.Path("render.yaml").read_text()
          required=[
              r"services:", r"type:\s*web", r"runtime:\s*python",
              r"buildCommand:", r"startCommand:", r"\$PORT", r"healthCheckPath:"
          ]
          missing=[pat for pat in required if not re.search(pat,text)]
          if missing:
              raise SystemExit(f"render.yaml missing required patterns: {missing}")
          print("render.yaml structural validation passed")
          PY
      - name: Install Render CLI
        if: env.RENDER_WORKSPACE != ''
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
      - name: Account-aware Render validation
        if: env.RENDER_WORKSPACE != ''
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          render blueprints validate render.yaml --workspace "$RENDER_WORKSPACE"
