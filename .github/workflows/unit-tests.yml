name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "src/ct.py"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest numpy Pillow pydicom
      - name: Run tests
        env:
          PYTHONPATH: "."
        run: pytest -q
